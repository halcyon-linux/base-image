name: build alcyone

on:
  schedule:
    # Daily rebuild (consumed COPRs republish; the image must track them).
    # Schedules only run from the default branch, and this branch is it.
    - cron: "40 4 * * *" # 4:40 UTC daily
  push:
    branches:
      - containerfile
    paths-ignore:
      - "**.md"
      - "**.txt"
  workflow_dispatch:
    inputs:
      allow_large_update:
        description: "Approve publishing a candidate above the 10 GiB update budget"
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  # Serialize all release triggers for a ref around the previous digest and tags.
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

env:
  REPO_OWNER: ${{ github.repository_owner }}
  FEDORA_VERSION: "45"
  KERNEL_FLAVOR: "ogc"
  IMAGE_NAME: "alcyone"
  PULL_REGISTRY: "ghcr.io/ublue-os"

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-26.04
    # Room for the image build, rechunk and zstd candidate push.
    timeout-minutes: 120

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: true
          # apt removal of large packages is the slow part (~1.5 min); the
          # compressed storage loopback below leaves enough headroom without it.
          large-packages: false

      # The final commit holds the image delta three times (working container,
      # layer blob, unpacked layer; ~30 GB each) and the rechunker copies it
      # again, which no longer fits uncompressed on the runner's root disk.
      # Put rootless container storage, TMPDIR (buildah cache mounts) and the
      # rechunk output on a zstd-compressed btrfs loopback. /mnt is not a
      # separate disk on ubuntu-26.04, so the file lives on /; it is sparse and
      # discard punches holes, so it only uses disk for compressed data. Must
      # run before the first podman pull.
      - name: Mount compressed container storage
        run: |
          set -euo pipefail
          sudo apt-get install -y btrfs-progs
          storage="$HOME/.local/share/containers"
          loopfile=/container-storage.btrfs
          avail=$(df --output=avail -B1 / | tail -n 1)
          mkdir -p "$storage"
          sudo truncate -s "$((avail * 90 / 100))" "$loopfile"
          sudo mkfs.btrfs -q "$loopfile"
          sudo mount -o loop,compress-force=zstd:1,discard=async,noatime "$loopfile" "$storage"
          sudo chown "$(id -u):$(id -g)" "$storage"
          mkdir -p "$storage/tmp"
          echo "TMPDIR=$storage/tmp" >> "$GITHUB_ENV"
          df -h / "$storage"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check just syntax
        uses: ublue-os/just-action@30ab4659369934b65b655bf8d2fa4ddd6547d384 # v3

      - name: Check dnf5 retry shim
        run: bash tests/test-dnf5-retry.sh

      - name: Run repo audit and lint tests
        run: bash tests/test-audit-lint.sh

      - name: Test OCI update-size budget
        run: python3 -B -m unittest discover -s tests -p 'test_compare_oci_manifests.py'

      # Needed before the build to verify upstream image signatures, and after
      # it to sign the pushed image.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # The image registry name must be lower-case, but GitHub usernames can be capitalized.
      - name: Get lower-case equivalent of the repository owner's username
        id: repo_owner_case
        run: echo "lowercase=${REPO_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Define image variables
        id: base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The image ships the NCT6687D hwmon kmod for the MSI Z790-P target from the
          # akmods-extra image. Upstream publishes that payload only when their own
          # build of the module succeeded for that kernel, so a kernel is accepted
          # only when its akmods-extra image really carries the kmod RPMs.
          REQUIRED_KMOD='nct6687d'

          # Walk published tags newest-first and select the first complete one
          # whose akmods-extra payload ships the required kmod. This deliberately
          # ignores the Containerfile defaults: the workflow must always build
          # the latest usable kernel, not the version pinned in the repository.
          AKMODS_TAG="$(just_scripts/resolve-akmods \
            "${KERNEL_FLAVOR}" "${FEDORA_VERSION}" x86_64 "${REQUIRED_KMOD}")"

          FINAL_KVER="${AKMODS_TAG#"${KERNEL_FLAVOR}-${FEDORA_VERSION}-"}"
          echo "Selected akmods tag ${AKMODS_TAG} (kernel ${FINAL_KVER})."

          PUSH_REGISTRY=ghcr.io/${{ steps.repo_owner_case.outputs.lowercase }}
          echo "output_image=${PUSH_REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "base_image=${PULL_REGISTRY}/base-main:${FEDORA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "container_target=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "kernel_version=${FINAL_KVER}" >> "$GITHUB_OUTPUT"
          echo "akmods_tag=${AKMODS_TAG}" >> "$GITHUB_OUTPUT"

          echo "Generated the following:"
          cat "$GITHUB_OUTPUT"

      # Check the ublue-os signature of every input image (build_files/keys/
      # ublue-os.pub) and build FROM the verified digests only.
      - name: Verify upstream image signatures
        id: upstream
        run: |
          set -euo pipefail
          just_scripts/verify-upstream-images \
            "${FEDORA_VERSION}" "${{ steps.base.outputs.akmods_tag }}" > upstream.env
          cat upstream.env
          if [[ $(grep -c '@sha256:' upstream.env) -ne 5 ]]; then
            echo "expected 5 verified upstream digests" >&2
            exit 1
          fi
          cat upstream.env >> "$GITHUB_OUTPUT"

      - name: Pull images and find versions
        id: labels
        run: |
          set -euo pipefail

          podman pull "${{ steps.upstream.outputs.BASE_IMAGE }}"
          skopeo inspect "docker://${{ steps.upstream.outputs.BASE_IMAGE }}" > source.json
          UPSTREAM_TAG=$(jq -r '.Labels["org.opencontainers.image.version"]' source.json)
          if [ -z "$UPSTREAM_TAG" ] || [ "null" = "$UPSTREAM_TAG" ]; then
            echo "inspected image version must not be empty or null"
            exit 1
          fi
          # Remove .0 suffix from upstream tag so we can add our own and
          # the wrong one does not end up in the image.
          UPSTREAM_TAG="${UPSTREAM_TAG%.[0-9]}"

          echo "tag=${UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"
          echo "pretty=Stable (F${UPSTREAM_TAG})" >> "$GITHUB_OUTPUT"

          podman pull "${{ steps.upstream.outputs.AKMODS_REF }}"
          podman pull "${{ steps.upstream.outputs.AKMODS_EXTRA_REF }}"
          podman pull "${{ steps.upstream.outputs.AKMODS_NVIDIA_REF }}"

      # Generate a file with all the build-args passed to buildah
      - name: Prepare build args file
        run: |
          cat <<EOF > build_args.txt
          FEDORA_VERSION=${FEDORA_VERSION}
          BASE_IMAGE=${{ steps.upstream.outputs.BASE_IMAGE }}
          BREW_IMAGE=${{ steps.upstream.outputs.BREW_IMAGE }}
          AKMODS_REF=${{ steps.upstream.outputs.AKMODS_REF }}
          AKMODS_EXTRA_REF=${{ steps.upstream.outputs.AKMODS_EXTRA_REF }}
          AKMODS_NVIDIA_REF=${{ steps.upstream.outputs.AKMODS_NVIDIA_REF }}
          IMAGE_NAME=${IMAGE_NAME}
          IMAGE_VENDOR=${{ steps.repo_owner_case.outputs.lowercase }}
          IMAGE_BRANCH=stable
          KERNEL_FLAVOR=${KERNEL_FLAVOR}
          KERNEL_VERSION=${{ steps.base.outputs.kernel_version }}
          AKMODS_TAG=${{ steps.base.outputs.akmods_tag }}
          VERSION_TAG=${{ steps.labels.outputs.tag }}
          VERSION_PRETTY=${{ steps.labels.outputs.pretty }}
          EOF

      # Build image using buildah and save it to raw-img
      - name: Build Image
        id: build_image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          df -h / /mnt /home || true
          df -i / || true
          buildah build \
            --target ${{ steps.base.outputs.container_target }} \
            --build-arg-file build_args.txt \
            --secret "id=GITHUB_TOKEN,env=GITHUB_TOKEN" \
            --tag raw-img .

      # Disk numbers for sizing the build; also runs when Build Image fails.
      - name: Report disk usage
        if: always() && steps.build_image.outcome != 'skipped'
        run: |
          df -h / ~/.local/share/containers || true
          df -i / || true
          ls -ls /container-storage.btrfs || true
          sudo btrfs filesystem usage ~/.local/share/containers || true
          podman system df || true
          buildah containers || true
          sudo du -sh ~/.local/share/containers/* 2>/dev/null || true
          sudo du -xh -d1 / 2>/dev/null | sort -h | tail -n 15 || true
          sudo du -xh -d1 /var /home/runner 2>/dev/null | sort -h | tail -n 15 || true

      # Size data for deciding what to trim from the image.
      - name: Report image contents
        if: steps.build_image.outcome == 'success'
        run: |
          podman run --rm --pull=never --network=none raw-img sh -c '
            echo "Largest RPMs (bytes):"
            rpm -qa --qf "%{SIZE}\t%{NAME}\n" | sort -rn | head -n 40
            echo "Largest directories:"
            du -xh -d2 /usr /opt 2>/dev/null | sort -h | tail -n 30
          ' || true

      # Apply labels and gather the kernel version before rechunking.
      - name: Apply Labels
        id: relabel
        env:
          IMAGE_LABELS: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/containerfile/README.md
            org.opencontainers.image.description=Halcyon (alcyone) — Hyprland Fedora Atomic gaming image built from Universal Blue base-main with the NVIDIA open kernel modules (Containerfile variant).
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Halcyon (alcyone)
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail

          img=raw-img
          kver=$(podman run --rm "$img" rpm -q --qf "%{VERSION}-%{RELEASE}.%{ARCH}\n" kernel-core)
          mapfile -t labels <<< "$IMAGE_LABELS"
          labels+=(
            "org.opencontainers.image.version=${{ steps.labels.outputs.tag }}"
            "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            "ostree.bootable=true"
            "ostree.linux=$kver"
          )

          : > "${RUNNER_TEMP}/labels.txt"
          for line in "${labels[@]}"; do
            [ -z "$line" ] && continue
            printf '%s\n' "$line" >> "${RUNNER_TEMP}/labels.txt"
          done

          echo "Labels for the final image:"
          cat "${RUNNER_TEMP}/labels.txt"

      # Reprocess raw-img using rechunker which will delete it
      - name: Run Rechunker
        id: rechunk
        env:
          OUTPUT_IMAGE: ${{ steps.base.outputs.output_image }}
        run: |
          set -euo pipefail

          buildah unshare bash -euo pipefail -c '
            container=$(buildah from raw-img)
            mnt=$(buildah mount "$container")
            rm -rf "$mnt"/run/.* "$mnt"/run/* "$mnt"/tmp/.* "$mnt"/tmp/* || true
            buildah umount "$container"
            buildah commit --identity-label=false --rm "$container" raw-img
          '

          # Kept until the job ends: the push step copies straight from it.
          RECHUNK_DIR="${TMPDIR:-$RUNNER_TEMP}/rechunk"
          rm -rf "${RECHUNK_DIR}"
          mkdir -p "${RECHUNK_DIR}"

          label_args=()
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              label_args+=(--label "$line")
            fi
          done < "${RUNNER_TEMP}/labels.txt"

          # Reuse the published image's layer plan so unchanged packages stay
          # in unchanged layers and clients only download what changed.
          previous_args=()
          previous="docker://${OUTPUT_IMAGE}:latest"
          previous_digest=""
          if previous_digest=$(skopeo inspect --format '{{.Digest}}' "${previous}" 2>"${RUNNER_TEMP}/previous-inspect.err"); then
            previous="docker://${OUTPUT_IMAGE}@${previous_digest}"
            previous_args=(--previous-build "${previous}")
            skopeo inspect --raw "${previous}" > "${RUNNER_TEMP}/previous-manifest.json"
          elif grep -Eqi 'manifest unknown|name unknown|manifest not found' "${RUNNER_TEMP}/previous-inspect.err"; then
            echo "No previous build at ${previous}; using a fresh layer plan."
          else
            cat "${RUNNER_TEMP}/previous-inspect.err" >&2
            echo "Could not inspect the previous build; refusing to publish with a fresh layer plan." >&2
            exit 1
          fi

          rechunk() {
            podman run --rm \
                --pull=never \
                --privileged \
                --mount=type=image,src=localhost/raw-img,target=/rpm-ostree \
                --volume "${RECHUNK_DIR}:/run/out:Z" \
                --entrypoint /usr/bin/rpm-ostree \
                localhost/raw-img \
                compose build-chunked-oci \
                --bootc --max-layers 127 --format-version 2 \
                "$@" \
                "${label_args[@]}" \
                --rootfs /rpm-ostree --output oci:/run/out/chunked
          }

          # A failed previous-build rechunk must not silently reshuffle every
          # layer and publish a multi-gigabyte update.
          rechunk "${previous_args[@]}"

          podman rmi -f localhost/raw-img

          # Push straight from the OCI directory: no pull into containers-storage
          # and no second copy of the image on disk.
          echo "ref=oci:${RECHUNK_DIR}/chunked" >> "$GITHUB_OUTPUT"
          echo "previous_digest=${previous_digest}" >> "$GITHUB_OUTPUT"

      # cosign reads credentials from the Docker config path, so point podman's
      # login there; skopeo copy also uses it as a fallback.
      - name: Login to GitHub Container Registry
        run: |
          mkdir -p "$HOME/.docker"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login \
            --authfile "$HOME/.docker/config.json" \
            ghcr.io -u "${{ github.actor }}" --password-stdin

      # Stage a run-unique candidate first; latest stays unchanged until the
      # compressed layer delta passes its budget and the candidate is signed.
      - name: Push candidate image to GHCR
        id: candidate
        if: github.ref == 'refs/heads/containerfile'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          OUTPUT_IMAGE: ${{ steps.base.outputs.output_image }}
          RECHUNK_REF: ${{ steps.rechunk.outputs.ref }}
          CANDIDATE_TAG: candidate-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 30
          command: |
            set -euo pipefail
            skopeo copy --dest-compress-format zstd --dest-force-compress-format \
              --digestfile /tmp/candidate-digest \
              "${RECHUNK_REF}" "docker://${OUTPUT_IMAGE}:${CANDIDATE_TAG}"

            digest="$(< /tmp/candidate-digest)"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "candidate push returned an invalid digest: ${digest}" >&2
              exit 1
            fi
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Enforce update-size budget
        id: budget
        if: github.ref == 'refs/heads/containerfile' && steps.rechunk.outputs.previous_digest != ''
        env:
          OUTPUT_IMAGE: ${{ steps.base.outputs.output_image }}
          PREVIOUS_DIGEST: ${{ steps.rechunk.outputs.previous_digest }}
          CURRENT_DIGEST: ${{ steps.candidate.outputs.digest }}
          ALLOW_LARGE_UPDATE: ${{ inputs.allow_large_update }}
          MAX_UPDATE_BYTES: "10737418240"
        run: |
          set -euo pipefail
          allow_args=()
          if [[ "${ALLOW_LARGE_UPDATE:-false}" == "true" ]]; then
            allow_args+=(--allow-large-update)
          fi
          skopeo inspect --raw "docker://${OUTPUT_IMAGE}@${CURRENT_DIGEST}" > "${RUNNER_TEMP}/current-manifest.json"
          gate_status=0
          if python3 just_scripts/compare-oci-manifests \
            "${RUNNER_TEMP}/previous-manifest.json" \
            "${RUNNER_TEMP}/current-manifest.json" \
            --max-added-bytes "${MAX_UPDATE_BYTES}" \
            "${allow_args[@]}" > "${RUNNER_TEMP}/layer-metrics.json"; then
            :
          else
            gate_status=$?
          fi
          if [[ "${gate_status}" -gt 1 ]]; then
            exit "${gate_status}"
          fi

          jq -r '"Previous payload: \(.previous_bytes) bytes in \(.previous_layers) layers",
            "Candidate payload: \(.current_bytes) bytes in \(.current_layers) layers",
            "Reused payload: \(.reused_bytes) bytes in \(.reused_layers) layers",
            "Added payload: \(.added_bytes) bytes in \(.added_layers) layers",
            "Largest added layers:",
            (.largest_added_layers[] | "  \(.size) bytes  \(.digest)")' \
            "${RUNNER_TEMP}/layer-metrics.json"
          added_bytes="$(jq -r '.added_bytes' "${RUNNER_TEMP}/layer-metrics.json")"
          {
            echo "### Candidate update-size report"
            echo "- Previous digest: `${PREVIOUS_DIGEST}`"
            echo "- Candidate digest: `${CURRENT_DIGEST}`"
            echo "- Added compressed layers: ${added_bytes} bytes"
            if [[ "${ALLOW_LARGE_UPDATE:-false}" == "true" ]]; then
              echo "- Large-update override: enabled"
            else
              echo "- Large-update override: disabled"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "added_bytes=${added_bytes}" >> "$GITHUB_OUTPUT"
          if [[ "${gate_status}" -ne 0 ]]; then
            exit "${gate_status}"
          fi

      - name: Sign candidate image
        if: github.ref == 'refs/heads/containerfile'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          OUTPUT_IMAGE: ${{ steps.base.outputs.output_image }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false \
            "${OUTPUT_IMAGE}@${CANDIDATE_DIGEST}"

      # Promote latest last; verify every alias still resolves to the signed digest.
      - name: Promote signed image
        id: promote
        if: github.ref == 'refs/heads/containerfile'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          OUTPUT_IMAGE: ${{ steps.base.outputs.output_image }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 30
          command: |
            set -euo pipefail
            source="docker://${OUTPUT_IMAGE}@${CANDIDATE_DIGEST}"
            for tag in stable "$(date +%Y%m%d)" latest; do
              skopeo copy --preserve-digests "$source" "docker://${OUTPUT_IMAGE}:${tag}"
              actual="$(skopeo inspect --format '{{.Digest}}' "docker://${OUTPUT_IMAGE}:${tag}")"
              if [[ "$actual" != "${CANDIDATE_DIGEST}" ]]; then
                echo "${tag} points to ${actual}, expected ${CANDIDATE_DIGEST}" >&2
                exit 1
              fi
              echo "Promoted ${tag} to ${CANDIDATE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "digest=${CANDIDATE_DIGEST}" >> "$GITHUB_OUTPUT"
