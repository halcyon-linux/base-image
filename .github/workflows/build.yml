name: build alcyone

on:
  schedule:
    # Daily rebuild (consumed COPRs republish; the image must track them).
    # Schedules only run from the default branch, and this branch is it.
    - cron: "40 4 * * *" # 4:40 UTC daily
  push:
    branches:
      - containerfile
    paths-ignore:
      - "**.md"
      - "**.txt"
  workflow_dispatch:

permissions: {}

concurrency:
  # Per trigger: a push may cancel an older push, but a manual dispatch must
  # not be killed by a push that lands while it is still running.
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  REPO_OWNER: ${{ github.repository_owner }}
  FEDORA_VERSION: "44"
  KERNEL_FLAVOR: "ogc"
  KERNEL_VERSION: "7.2.7-ogc1.1.fc44"
  IMAGE_NAME: "alcyone"
  PULL_REGISTRY: "ghcr.io/ublue-os"

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check just syntax
        uses: ublue-os/just-action@30ab4659369934b65b655bf8d2fa4ddd6547d384 # v3

      - name: Check dnf5 retry shim
        run: bash tests/test-dnf5-retry.sh

      # The image registry name must be lower-case, but GitHub usernames can be capitalized.
      - name: Get lower-case equivalent of the repository owner's username
        id: repo_owner_case
        run: echo "lowercase=${REPO_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Define image variables
        id: base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The image ships the NCT6687D hwmon kmod for the MSI Z790-P target from the
          # akmods-extra image. Upstream publishes that payload only when their own
          # build of the module succeeded for that kernel, so a kernel is accepted
          # only when its akmods-extra image really carries the kmod RPMs.
          REQUIRED_KMOD='nct6687d'

          akmods_tag_has_kmod() {
            local tag="$1" cid status=1
            podman pull --quiet "ghcr.io/ublue-os/akmods-extra:${tag}" >/dev/null 2>&1 || return 1
            cid="$(podman create "ghcr.io/ublue-os/akmods-extra:${tag}")" || return 1
            if podman export "$cid" | tar -tf - | grep -F -- "${REQUIRED_KMOD}" >/dev/null; then
              status=0
            fi
            podman rm "$cid" >/dev/null 2>&1 || true
            return "${status}"
          }

          akmods_tag_complete() {
            local tag="$1" repo
            for repo in akmods akmods-extra akmods-nvidia-open; do
              if ! skopeo inspect --retry-times 2 --creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
                   "docker://ghcr.io/ublue-os/${repo}:${tag}" >/dev/null 2>&1; then
                echo "ghcr.io/ublue-os/${repo}:${tag} is not published."
                return 1
              fi
            done
            akmods_tag_has_kmod "${tag}"
          }

          # Dynamically resolve latest upstream ogc kernel version from ublue-os/bazzite
          RESOLVED_KVER=$(python3 - << 'EOF'
          import os, sys, urllib.request, json, base64, re

          token = os.environ.get("GITHUB_TOKEN", "")
          headers = {"User-Agent": "Mozilla/5.0"}
          if token:
              headers["Authorization"] = f"Bearer {token}"

          flavor = os.environ.get("KERNEL_FLAVOR", "ogc")
          fallback = os.environ.get("KERNEL_VERSION", "")

          resolved = None
          try:
              req = urllib.request.Request(
                  "https://api.github.com/repos/ublue-os/bazzite/contents/.github/workflows/build.yml",
                  headers=headers
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read().decode())
                  content = base64.b64decode(data["content"]).decode()
                  # The flavor must match exactly: "ogc" also matches "ogc-lts".
                  m = re.search(rf"kernel_flavor:[ \t]*{re.escape(flavor)}[ \t]*\n[ \t]*kernel_version:[ \t]*([^\s]+)", content)
                  if m:
                      resolved = m.group(1).strip()
          except Exception as e:
              print(f"Notice: Failed to query upstream bazzite workflow: {e}", file=sys.stderr)

          if resolved:
              print(resolved)
          else:
              print(fallback)
          EOF
          )

          # Candidate 1: the kernel version bazzite pins for this flavor.
          candidates=("${KERNEL_FLAVOR}-${FEDORA_VERSION}-${RESOLVED_KVER}")

          # Candidate 2: the newest kernel upstream published for this flavor.
          NEWEST_TAG=$(skopeo list-tags --retry-times 2 \
            --creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker://ghcr.io/ublue-os/akmods-extra" 2>/dev/null \
            | jq -r '.Tags[]' \
            | grep -E "^${KERNEL_FLAVOR}-${FEDORA_VERSION}-[0-9]" \
            | grep -v '\.x86_64$' \
            | sort -V \
            | tail -n 1)
          if [ -n "${NEWEST_TAG}" ]; then
            candidates+=("${NEWEST_TAG}")
          fi

          # Candidate 3: the kernel pinned in this workflow, known to ship the kmod.
          candidates+=("${KERNEL_FLAVOR}-${FEDORA_VERSION}-${KERNEL_VERSION}")

          AKMODS_TAG=''
          for tag in "${candidates[@]}"; do
            echo "Checking akmods tag: ${tag}"
            if akmods_tag_complete "${tag}"; then
              AKMODS_TAG="${tag}"
              break
            fi
            echo "akmods tag ${tag} is incomplete; trying the next candidate."
          done

          if [ -z "${AKMODS_TAG}" ]; then
            echo "No published akmods tag ships ${REQUIRED_KMOD}; refusing to build without the board kmod." >&2
            exit 1
          fi

          FINAL_KVER="${AKMODS_TAG#"${KERNEL_FLAVOR}-${FEDORA_VERSION}-"}"
          echo "Selected akmods tag ${AKMODS_TAG} (kernel ${FINAL_KVER})."

          PUSH_REGISTRY=ghcr.io/${{ steps.repo_owner_case.outputs.lowercase }}
          echo "output_image=${PUSH_REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "base_image=${PULL_REGISTRY}/base-main:${FEDORA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "container_target=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "kernel_version=${FINAL_KVER}" >> "$GITHUB_OUTPUT"
          echo "akmods_tag=${AKMODS_TAG}" >> "$GITHUB_OUTPUT"

          echo "Generated the following:"
          cat "$GITHUB_OUTPUT"

      - name: Pull images and find versions
        id: labels
        run: |
          set -euo pipefail

          podman pull "${{ steps.base.outputs.base_image }}"
          skopeo inspect "docker://${{ steps.base.outputs.base_image }}" > source.json
          UPSTREAM_TAG=$(jq -r '.Labels["org.opencontainers.image.version"]' source.json)
          if [ -z "$UPSTREAM_TAG" ] || [ "null" = "$UPSTREAM_TAG" ]; then
            echo "inspected image version must not be empty or null"
            exit 1
          fi
          # Remove .0 suffix from upstream tag so we can add our own and
          # the wrong one does not end up in the image.
          UPSTREAM_TAG="${UPSTREAM_TAG%.[0-9]}"

          echo "tag=${UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"
          echo "pretty=Stable (F${UPSTREAM_TAG})" >> "$GITHUB_OUTPUT"

          podman pull "ghcr.io/ublue-os/akmods:${{ steps.base.outputs.akmods_tag }}"
          podman pull "ghcr.io/ublue-os/akmods-extra:${{ steps.base.outputs.akmods_tag }}"
          podman pull "ghcr.io/ublue-os/akmods-nvidia-open:${{ steps.base.outputs.akmods_tag }}"

      # Generate a file with all the build-args passed to buildah
      - name: Prepare build args file
        run: |
          cat <<EOF > build_args.txt
          FEDORA_VERSION=${FEDORA_VERSION}
          BASE_IMAGE=${{ steps.base.outputs.base_image }}
          IMAGE_NAME=${IMAGE_NAME}
          IMAGE_VENDOR=${{ steps.repo_owner_case.outputs.lowercase }}
          IMAGE_BRANCH=stable
          KERNEL_FLAVOR=${KERNEL_FLAVOR}
          KERNEL_VERSION=${{ steps.base.outputs.kernel_version }}
          AKMODS_TAG=${{ steps.base.outputs.akmods_tag }}
          VERSION_TAG=${{ steps.labels.outputs.tag }}
          VERSION_PRETTY=${{ steps.labels.outputs.pretty }}
          EOF

      # Build image using buildah and save it to raw-img
      - name: Build Image
        id: build_image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          buildah build \
            --target ${{ steps.base.outputs.container_target }} \
            --build-arg-file build_args.txt \
            --secret "id=GITHUB_TOKEN,env=GITHUB_TOKEN" \
            --tag raw-img .

      # Apply labels and gather the kernel version before rechunking.
      - name: Apply Labels
        id: relabel
        env:
          IMAGE_LABELS: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/containerfile/README.md
            org.opencontainers.image.description=Halcyon (alcyone) — DE-free Fedora Atomic gaming image built from Universal Blue base-main with the NVIDIA open kernel modules (Containerfile variant).
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Halcyon (alcyone)
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail

          img=raw-img
          kver=$(podman run --rm "$img" rpm -q --qf "%{VERSION}-%{RELEASE}.%{ARCH}\n" kernel-core)
          mapfile -t labels <<< "$IMAGE_LABELS"
          labels+=(
            "org.opencontainers.image.version=${{ steps.labels.outputs.tag }}"
            "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            "ostree.bootable=true"
            "ostree.linux=$kver"
          )

          : > "${RUNNER_TEMP}/labels.txt"
          for line in "${labels[@]}"; do
            [ -z "$line" ] && continue
            printf '%s\n' "$line" >> "${RUNNER_TEMP}/labels.txt"
          done

          echo "Labels for the final image:"
          cat "${RUNNER_TEMP}/labels.txt"

      # Reprocess raw-img using rechunker which will delete it
      - name: Run Rechunker
        id: rechunk
        run: |
          set -euo pipefail

          buildah unshare bash -euo pipefail -c '
            container=$(buildah from raw-img)
            mnt=$(buildah mount "$container")
            rm -rf "$mnt"/run/.* "$mnt"/run/* "$mnt"/tmp/.* "$mnt"/tmp/* || true
            buildah umount "$container"
            buildah commit --identity-label=false --rm "$container" raw-img
          '

          RECHUNK_DIR="$(mktemp -d "${RUNNER_TEMP}/rechunk-XXXXXX")"
          trap 'rm -rf "${RECHUNK_DIR}"' EXIT

          label_args=()
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              label_args+=(--label "$line")
            fi
          done < "${RUNNER_TEMP}/labels.txt"

          podman run --rm \
              --pull=never \
              --privileged \
              --mount=type=image,src=localhost/raw-img,target=/rpm-ostree \
              --volume "${RECHUNK_DIR}:/run/out:Z" \
              --entrypoint /usr/bin/rpm-ostree \
              localhost/raw-img \
              compose build-chunked-oci \
              --bootc --max-layers 127 --format-version 2 \
              "${label_args[@]}" \
              --rootfs /rpm-ostree --output oci-archive:/run/out/chunked.oci

          podman rmi -f localhost/raw-img

          chunked=$(podman pull oci-archive:"${RECHUNK_DIR}/chunked.oci")
          podman tag "${chunked}" localhost/chunked-img

          echo "ref=containers-storage:localhost/chunked-img" >> "$GITHUB_OUTPUT"

      # cosign reads credentials from the Docker config path, so point podman's
      # login there; podman push and skopeo copy also use it as a fallback.
      - name: Login to GitHub Container Registry
        run: |
          mkdir -p "$HOME/.docker"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login \
            --authfile "$HOME/.docker/config.json" \
            ghcr.io -u "${{ github.actor }}" --password-stdin

      # Only the default (release) branch publishes and signs: workflow_dispatch
      # can target any ref that carries this file — e.g. a tag — and such a run
      # must not overwrite stable/latest with that ref's code.
      - name: Push to GHCR
        id: push
        if: github.ref == 'refs/heads/containerfile'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          OUTPUT_IMAGE: ${{ steps.base.outputs.output_image }}
          RECHUNK_REF: ${{ steps.rechunk.outputs.ref }}
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 10
          command: |
            set -euo pipefail

            podman push --digestfile=/tmp/digestfile \
              "${RECHUNK_REF#containers-storage:}" "docker://${OUTPUT_IMAGE}:stable"

            digest="$(< /tmp/digestfile)"
            if [[ -z "$digest" ]]; then
              echo "push reported success but wrote no digest" >&2
              exit 1
            fi

            for tag in latest "$(date +%Y%m%d)"; do
              skopeo copy "docker://${OUTPUT_IMAGE}@${digest}" "docker://${OUTPUT_IMAGE}:${tag}"
            done

            echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign container image
        if: github.ref == 'refs/heads/containerfile'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false \
            ${{ steps.base.outputs.output_image }}@${{ steps.push.outputs.digest }}
