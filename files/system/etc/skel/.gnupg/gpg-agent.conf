# halcyon: GUI passphrase prompts under Hyprland. pinentry-gnome3 (GTK3 +
# gcr, both already in the bazzite base) is Wayland-native, so GUI
# applications that cannot reach a terminal (ZCode, browsers, mail) get a
# real dialog instead of dying on gpg-agent's curses fallback. pinentry-qt
# is deliberately NOT used: removals strips it with the KDE closure and a
# Qt pinentry would drag the Qt widget stack back in. /etc/skel seeds new
# users; chezmoi does not manage this file, so it survives --force applies.
pinentry-program /usr/bin/pinentry-gnome3
