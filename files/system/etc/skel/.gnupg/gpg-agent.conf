# halcyon: GUI passphrase prompts under Hyprland. pinentry-qt (shipped in the
# bazzite base) is Wayland-native, so GUI applications that cannot reach a
# terminal (ZCode, browsers, mail) get a real dialog instead of dying on
# gpg-agent's curses fallback. /etc/skel seeds new users; chezmoi does not
# manage this file, so it survives --force applies.
pinentry-program /usr/bin/pinentry-qt
