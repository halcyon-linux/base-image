[Unit]
# --global enablement also reaches the greetd greeter user; only real login
# users should clone and apply the dotfiles.
ConditionUser=!greetd

[Service]
# The module's init is a plain --apply: a home rebasing from a previous OS
# holds differing dotfiles and the non-interactive apply dies on the first
# "already exists". The update policy treats the repo as the source of
# truth (--force), so init matches.
ExecStart=
ExecStart=/usr/bin/chezmoi init --apply --force aahsnr-configs/dotfiles
# network-online.target does not exist in the USER manager, so ordering
# against it cannot guarantee connectivity for the clone; a failed first
# attempt must retry instead of waiting for the next login.
Restart=on-failure
RestartSec=15s
# A cold clone+apply of the dotfiles repo can outrun the user manager's
# ~90s default start timeout.
TimeoutStartSec=600
