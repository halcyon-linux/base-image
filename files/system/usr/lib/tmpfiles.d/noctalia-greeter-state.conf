# noctalia-greeter state dir. The lionheartp COPR package deliberately drops
# upstream's tmpfiles rule (it hardcodes the Arch-convention `greeter` user);
# on Fedora the greeter runs as `greetd`, and docs.noctalia.dev/greeter
# troubleshooting requires this dir mode 0750 owned by the configured greeter
# user. tmpfiles runs before greetd via systemd-tmpfiles-setup.
d /var/lib/noctalia-greeter 0750 greetd greetd - -
