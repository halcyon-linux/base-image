---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/halcyon-linux/halcyon
name: halcyon
description: >-
  Lean Hyprland gaming desktop forked from Bazzite (GNOME removed;
  Hyprland + Noctalia; NVIDIA open drivers inherited; curated dev tooling).
base-image: quay.io/fedora/fedora-bootc
image-version: 44
platforms:
  - linux/amd64

labels:
  halcyon.base: "fedora-bootc"
  halcyon.desktop: "hyprland-noctalia"

modules:
  - type: signing

  - type: files
    files:
      - source: system
        destination: /

  - type: files
    files:
      - source: dnf-libdnf5
        destination: /etc/dnf

  - from-file: modules/removals.yml

  - type: script
    scripts:
      - install-kernel.sh

  - from-file: modules/programming.yml
  - from-file: modules/apps.yml
  - from-file: modules/core.yml
  - from-file: modules/desktop.yml
  - from-file: modules/gaming.yml
  - from-file: modules/hardware.yml
  - from-file: modules/ublue-pkgs.yml
  - from-file: modules/terra.yml
  - from-file: modules/devtools.yml
  - from-file: modules/nix.yml
  - from-file: modules/texlive.yml
  - from-file: modules/ujust.yml
  - from-file: modules/finish.yml
  - from-file: modules/final-verify.yml
  - from-file: modules/bootc-lint.yml
