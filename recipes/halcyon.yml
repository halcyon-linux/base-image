---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/halcyon-linux/halcyon
name: halcyon
description: >-
  Lean Hyprland gaming desktop on the Bazzite base (KDE Plasma removed;
  Hyprland + Noctalia; NVIDIA open drivers inherited; native gaming stack;
  curated dev tooling).
base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: latest
platforms:
  - linux/amd64

labels:
  halcyon.base: "bazzite-nvidia-open"
  halcyon.desktop: "hyprland-noctalia"

# Module order is load-bearing (removals before every install, bootc-lint
# last) — the ordering rationale lives in AGENTS.md §1/§3.
modules:
  - type: signing

  # The signing module scopes policy.json + registries.d to the single ghcr
  # ref; the docker.io mirror (build.yml, same key, its own digest) gets the
  # same two entries here so the enforced rebase path works from either
  # registry. Must run AFTER signing — the module rewrites policy.json.
  - type: script
    scripts:
      - mirror-signing.sh

  - type: files
    files:
      - source: system
        destination: /

  - type: files
    files:
      - source: dnf-libdnf5
        destination: /etc/dnf

  - from-file: modules/removals.yml
  - from-file: modules/core.yml
  - from-file: modules/programming.yml
  - from-file: modules/fonts.yml
  - from-file: modules/gaming.yml
  - from-file: modules/desktop.yml
  - from-file: modules/devtools.yml
  - from-file: modules/nix.yml
  - from-file: modules/texlive.yml
  - from-file: modules/apps.yml
  - from-file: modules/python-packages.yml
  - from-file: modules/flatpaks.yml
  - from-file: modules/chezmoi.yml
  - from-file: modules/ujust.yml
  - from-file: modules/finish.yml
  - from-file: modules/final-verify.yml
  - from-file: modules/bootc-lint.yml
