---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/aahsnr-work/halcyon
name: halcyon
description: >-
  Lean Hyprland gaming desktop forked from Bazzite (GNOME removed;
  Hyprland + Noctalia; NVIDIA open drivers inherited; curated dev tooling).
base-image: quay.io/fedora/fedora-bootc
image-version: 44
platforms:
  - linux/amd64

labels:
  halcyon.base: "fedora-bootc"
  halcyon.desktop: "hyprland-noctalia"

modules:
  - type: files
    files:
      - source: system
        destination: / # files/system/** → /** (template+winter verified)

  # dnf5 retry/timeout drop-in — must be staged before the FIRST dnf module
  # (core.yml) runs, so flaky external repos (Copr CDN 504s) are retried
  # instead of aborting the build.
  - type: files
    files:
      - source: dnf-libdnf5
        destination: /etc/dnf

  # Stage 01
  - from-file: modules/removals.yml
  - from-file: modules/repos.yml

  # Stage 02 — kernel-nvidia: p03 kernel + prebuilt nvidia-open modules (Stage K1).
  - type: script
    scripts:
      - install-kernel.sh

  - from-file: modules/base-packages.yml
  - from-file: modules/terra.yml
  - from-file: modules/devtools.yml
  - from-file: modules/nix.yml
  - from-file: modules/built-apps.yml
  - from-file: modules/ujust-system.yml
  - from-file: modules/finish.yml
  - from-file: modules/final-verify.yml
  - from-file: modules/bootc-lint.yml
