---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # ujust-fedora companions (bazzite parity). grubby backs the kernel-arg
  # recipes; stress-ng powers `ujust benchmark`; glow is a deliberate
  # user-facing terminal markdown renderer; jq is required by the stage's
  # verify gate (and the vendored bazzite-steam wrapper). just itself is also
  # in core.yml — listed here to keep the ujust toolchain self-contained.
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - glow
        - grubby
        - jq
        - just
        - stress-ng

  # Unit state is declarative bluebuild (systemd module), not script logic.
  # Every enabled unit exists by this point (greetd — desktop.yml; uupd —
  # ublue-pkgs.yml; getty@.service — base systemd; user units — the overlay's
  # files module). var-nix.service + nix.mount are enabled by nix.yml.
  - type: systemd
    system:
      enabled:
        - uupd.timer
        - greetd.service
        - getty@tty2.service
      masked:
        - sddm.service
        - gdm.service
        - bazzite-autologin.service
        - nvidia-persistenced.service
        - nvidia-powerd.service
        # p03's LRU-Marie handles OOM kernel-side; the kernel README
        # (CatPieLeaf/linux-p03) instructs disabling oomd, which "kills apps
        # prematurely, or freezes the system".
        - systemd-oomd.service
    user:
      enabled:
        - pyprland.service
        - chezmoi-init.service
        - chezmoi-update.timer

  # Everything the systemd module cannot express: the ujust presence gates,
  # the steam/lutris desktop-entry patching (bazzite parity), and the
  # ujust+system verify tail.
  - type: script
    scripts:
      - ujust-system.sh
