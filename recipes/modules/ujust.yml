---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# ujust companions + declarative unit state. The bazzite base ships glow, jq,
# just and stress-ng (packages.md) — grubby is the only gap (the kernel-arg
# recipes in 80-halcyon.just need it).
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - grubby

  # Unit state is declarative bluebuild (systemd module), not script logic.
  # greetd/noctalia-greeter are removed — login is getty@tty2 and the user
  # starts Hyprland from the TTY (ly is planned, not landed). uupd ships in
  # the base; getty@.service is base systemd. var-nix.service + nix.mount are
  # enabled by nix.yml; the chezmoi units enable themselves --global in
  # chezmoi.yml.
  - type: systemd
    system:
      enabled:
        - uupd.timer
        - getty@tty2.service
      masked:
        - sddm.service
        - gdm.service
        - plasma-login-manager.service # KDE's login manager, removed with the stack
        - bazzite-autologin.service
        - nvidia-persistenced.service
        - nvidia-powerd.service
        # gaming box: oomd kills games prematurely or freezes the session —
        # keep it masked as on the previous build
        - systemd-oomd.service
    user:
      enabled:
        - pyprland.service

  # Everything the systemd module cannot express: the ujust presence gates
  # and the ujust+system verify tail (steam/lutris desktop wiring ships in
  # the bazzite base — no patching needed anymore).
  - type: script
    scripts:
      - ujust-system.sh
