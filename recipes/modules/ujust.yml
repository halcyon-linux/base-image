---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Declarative unit state only — no dnf block: glow, jq, just and stress-ng
# ship in the base, and grubby went with the halcyon grub recipes.
modules:
  # Declarative bluebuild (systemd module), not script logic: login is
  # getty@tty2 (ly planned); var-nix.service/nix.mount are enabled by
  # nix.yml, the chezmoi units enable themselves --global in chezmoi.yml.
  - type: systemd
    system:
      enabled:
        - uupd.timer
        - getty@tty2.service
        # /etc/default/useradd only covers user CREATION — an account made
        # under bazzite keeps /bin/bash across a rebase. This oneshot adopts
        # regular bash accounts into zsh every boot (no-op once done) and
        # completes before systemd-user-sessions, i.e. before getty spawns.
        - halcyon-shell-migration.service
      masked:
        - sddm.service
        - gdm.service
        - plasma-login-manager.service # KDE's login manager, removed with the stack
        - bazzite-autologin.service
        - nvidia-persistenced.service
        - nvidia-powerd.service
        # gaming box: oomd kills games prematurely or freezes the session —
        # keep it masked as on the previous build
        - systemd-oomd.service
        # flatpak state is owned by default-flatpaks (flatpaks.yml): bazzite's
        # manager re-enables flathub, re-applies flatpak overrides and sweeps
        # per its own policy; the nvidia sync/verify pair installs NVIDIA
        # flatpak GL runtimes and nags at boot; the ublue repos service
        # re-adds the fedora flatpak remotes — none of it belongs on a
        # zero-flatpak image
        - bazzite-flatpak-manager.service
        - ublue-nvidia-flatpak-runtime-sync.service
        - ublue-nvidia-flatpak-runtime-verify.service
        - flatpak-add-fedora-repos.service
    user:
      enabled:
        - pyprland.service

  # Everything the systemd module cannot express: the ujust presence gates
  # and the ujust+system verify tail (steam/lutris desktop wiring ships in
  # the bazzite base — no patching needed anymore).
  - type: script
    scripts:
      - ujust-system.sh
