---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Native gaming stack (RakuOS model — RPMs, no Flatpak); the base already
# ships the steam/lutris/gamescope/mangohud stack. The base's terra/rpmfusion
# repo files are SHIPPED DISABLED, so heroic-games-launcher needs the scoped
# terra-gaming.repo staged here. The NVIDIA excludes keep any transaction
# off the base's kmod-nvidia/nvidia-driver chain.
modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - terra-gaming.repo
    install:
      install-weak-deps: false
      exclude:
        - "xorg-x11-drv-nvidia*"
        - "akmod-nvidia*"
        - "kmod-nvidia*"
        - "nvidia-kmod*"
      packages:
        - gamemode
        - heroic-games-launcher # native Terra RPM (matches RakuOS' stack)

  - type: script
    scripts:
      - repo-leftover-sweep.sh

  - type: script
    scripts:
      - verify-gaming.sh
