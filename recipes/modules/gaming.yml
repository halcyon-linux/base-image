---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Native gaming stack (RakuOS model: Steam/Lutris/Heroic as native RPMs, no
# Flatpak). The bazzite base already ships steam, steam-devices, lutris,
# gamescope, mangohud (+i686), zenity, evtest, input-remapper, usbip and
# ydotool with Terra repos enabled — only the gaps install here, from Fedora
# and Terra. No `nonfree: rpmfusion` staging: the base ships its own
# rpmfusion/terra repo files. The NVIDIA excludes stay as belt-and-suspenders
# so no transaction can ever clobber the base's kmod-nvidia/nvidia-driver
# userland with an rpmfusion akmod chain.
modules:
  - type: dnf
    install:
      install-weak-deps: false
      exclude:
        - "xorg-x11-drv-nvidia*"
        - "akmod-nvidia*"
        - "kmod-nvidia*"
        - "nvidia-kmod*"
      packages:
        - gamemode
        - heroic-games-launcher # native Terra RPM (matches RakuOS' stack)

  - type: script
    scripts:
      - verify-gaming.sh
