---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# CLI tools from the personal cli-tools COPR, minus everything the bazzite
# base already ships (bat, btop, cava, chafa, cliphist, dust, eza, fd-find,
# fpaste, fzf, gnuplot, opencode, pandoc — all in packages.md).
modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - cli-tools.repo # priority=1: Copr wins over Fedora/Terra
    install:
      install-weak-deps: false
      packages:
        - asdf
        - atuin
        - bun
        - direnv
        - fzy
        - kilo
        - lazygit
        - marksman
        - pixi
        - ripgrep
        - starship
        - tealdeer
        - texlab
        - topgrade
        - uv

  - type: script
    scripts:
      - repo-leftover-sweep.sh

  - type: script
    scripts:
      - verify-devtools.sh
