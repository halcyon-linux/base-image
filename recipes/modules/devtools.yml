---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# CLI tools from the personal cli-tools COPR. btop + fpaste are
# base-provided keepers (the COPR doesn't build them).
modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - cli-tools.repo # priority=1: Copr wins over Fedora/Terra
    install:
      install-weak-deps: false
      packages:
        - asdf
        - atuin
        - bat
        - bat-extras
        - bun
        - cava
        - chafa
        - cliphist
        - direnv
        - dust
        - eza
        - fd-find
        - fzf # COPR build; the base copy is stripped in removals.yml
        - fzy
        - gnuplot
        - kilo
        - lazygit
        - marksman
        - opencode
        - pandoc
        - pixi
        - ripgrep
        - starship
        - tealdeer
        - texlab
        - topgrade
        - uv

  - type: script
    scripts:
      - repo-leftover-sweep.sh

  - type: script
    scripts:
      - verify-devtools.sh
