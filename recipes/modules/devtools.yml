---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - cli-tools.repo # priority=1: Copr wins over Fedora/Terra
    install:
      install-weak-deps: false
      packages:
        - asdf
        - atuin
        - bat
        - bat-extras
        - btop
        - bun
        - cava
        - chafa
        - chezmoi
        - cliphist
        - direnv
        - dust
        - eza
        - fd-find
        - fpaste
        - fzf
        - fzy
        - gnuplot
        - kilo
        - lazygit
        - marksman
        - opencode
        - pandoc
        - pixi
        - ripgrep
        - starship
        - tealdeer
        - texlab
        - topgrade
        - uv

  - type: script
    scripts:
      - repo-leftover-sweep.sh

  - type: script
    scripts:
      - verify-devtools.sh
