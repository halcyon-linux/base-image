---
# $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: systemd
    system:
      enabled:
        - var-nix.service
        - nix.mount

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - nix
        - nix-daemon # nix multi-user/systemd install

  - type: systemd
    system:
      enabled:
        - nix-daemon

  - type: script
    scripts:
      - verify-nix.sh
