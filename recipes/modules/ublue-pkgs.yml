---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - ublue-os-packages.repo # priority=1: Copr wins over Fedora/Terra
    install:
      install-weak-deps: false
      packages:
        - bazaar
        - ublue-os-just
        - ublue-os-luks
        - ublue-os-selinux-workarounds
        - ublue-os-signing
        - ublue-recipes
        - uupd

  - type: script
    scripts:
      - repo-leftover-sweep.sh

  - type: script
    scripts:
      - verify-ublue-pkgs.sh
