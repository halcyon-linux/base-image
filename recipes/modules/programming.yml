---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Toolchains the bazzite base does not ship (python3, perl and gcc-c++ are
# already in the base — verified against packages.md).
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - nodejs22
        - nodejs22-npm
        - cargo
        - cmake
        - golang

  - type: script
    scripts:
      - verify-programming.sh
