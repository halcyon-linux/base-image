---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # Fedora 44's own texlive generation: per-CTAN components + texlive-collection-*
  # metas, engines and runfiles from one source. The aahsnr-work/texlive-packages
  # COPR (texmf-dist-only data monoliths) cannot coexist with these engines —
  # texlive-luatex/xetex collide by name and the engines hard-require the Fedora
  # component data that file-conflicts with the COPR tree — so it is unused here
  # until the splitter is redesigned.
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - texlive-collection-basic
        - texlive-collection-bibtexextra
        - texlive-collection-binextra
        - texlive-collection-fontsrecommended
        - texlive-collection-fontutils
        - texlive-collection-formatsextra
        - texlive-collection-latex
        - texlive-collection-latexextra
        - texlive-collection-latexrecommended
        - texlive-collection-luatex
        - texlive-collection-mathscience
        - texlive-collection-publishers

  - type: script
    scripts:
      - verify-texlive.sh
