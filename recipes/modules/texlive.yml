---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # Rolling TeX Live from aahsnr-work/texlive-packages: the texmf-dist data
  # groups plus texlive-bin (upstream's engine bundle) all install under one
  # self-contained /usr/lib/texlive/<year> root, so nothing resolves from
  # Fedora's fixed-release texlive packaging. texlive-formats.sh bakes the
  # format files after the transaction; verify-texlive.sh gates the result.
  - type: dnf
    repos:
      cleanup: true
      files:
        - texlive-packages.repo # priority=1: Copr wins over Fedora/Terra
    install:
      install-weak-deps: false
      packages:
        - texlive-bin
        - texlive-basic
        - texlive-bibtexextra
        - texlive-binextra
        - texlive-fontsrecommended
        - texlive-fontutils
        - texlive-formatsextra
        - texlive-latex
        - texlive-latexextra
        - texlive-latexrecommended
        - texlive-luatex
        - texlive-mathscience
        - texlive-publishers

  - type: script
    scripts:
      - texlive-formats.sh

  - type: script
    scripts:
      - repo-leftover-sweep.sh

  - type: script
    scripts:
      - verify-texlive.sh
