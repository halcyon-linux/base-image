---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://raw.githubusercontent.com/terrapkg/subatomic-repos/main/terra.repo
    install:
      install-weak-deps: false
      no-gpgchecks: true
      exclude:
        - zlib
      packages:
        - terra-release-extras
        - terra-release-mesa
        - terra-release-multimedia

  - type: dnf
    repos:
      cleanup: true
      files:
        - https://raw.githubusercontent.com/terrapkg/subatomic-repos/main/terra.repo
    install:
      install-weak-deps: false
      no-gpgchecks: true
      exclude:
        - zlib
      packages:
        - bazzite-portal
        - scx-scheds
        - scx-tools
        - umu-launcher
        - umu-wrapper
        - bibata-cursor-theme

  # repos.cleanup only removes the module-staged terra.repo; the
  # terra-release-* RPMs ship five enabled repo files of their own. Delete
  # them here so no later dnf transaction can resolve off Terra.
  - type: script
    scripts:
      - terra-repo-sweep.sh

  - type: script
    scripts:
      - verify-terra.sh
