---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# The Hyprland + Noctalia stack from the personal base-pkgs COPR, on top of
# the bazzite base. greetd/noctalia-greeter are gone (login is getty@tty2;
# ly is planned but not landed) and the Thunar suite is replaced by
# nautilus (file-roller installs in core.yml). Noctalia ships its own polkit
# agent, so the KDE removal in removals.yml does not strand GUI auth prompts.
modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - base-pkgs.repo # priority=1: Copr wins over Fedora/Terra
    install:
      install-weak-deps: false
      packages:
        - adw-gtk3
        - aquamarine
        - cliphist
        - glaze
        - gnome-keyring
        - gnome-keyring-pam # pam_gnome_keyring.so for the future ly stack
        - gnome-tweaks
        - hyprcursor
        - hyprgraphics
        - hyprland-git
        - hyprland-guiutils
        - hyprland-protocols
        - hyprland-qt-support
        - hyprlang
        - hyprpwcenter
        - hyprshutdown
        - hyprtoolkit
        - hyprutils
        - hyprwayland-scanner
        - hyprwire
        - nautilus # replaces the removed Thunar suite
        - noctalia-git
        - nwg-displays
        - nwg-look
        - papers
        - papirus-icon-theme
        - pyprland
        - qt6ct
        # xdg-desktop-portal-gtk and wl-clipboard are deliberately absent:
        # the bazzite base ships both under the same names and dnf5 errors on
        # install-of-installed (proven by CI 2026-10-05); verify-desktop
        # keeps asserting their presence as base-provided keepers.
        - xdg-desktop-portal-hyprland

  - type: script
    scripts:
      - repo-leftover-sweep.sh

  - type: script
    scripts:
      - verify-desktop.sh
