---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Only what the bazzite base does NOT already ship (every name checked
# against the base image — dnf5 errors on install-of-installed, and
# terra-name twins conflict). Deliberately absent: libinput-utils (base
# ships the name), ddcutil (base ships terra-ddcutil), mpv (Fedora's needs
# libavfilter-free, obsoleted by the base's epoch-1 rpmfusion ffmpeg).
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # CLI / system utilities missing from the base
        - bleachbit
        - bluez-tools
        - brightnessctl
        - cronie
        - fail2ban
        - git
        - inotify-tools
        - igt-gpu-tools # intel-gpu-tools is renamed in Fedora 44 — dnf
                        # resolves the old name via provides, the gate must
                        # use the real one
        - lynis
        - ninja-build
        - pinentry-gnome3 # removals auto-removed pinentry-qt as a KDE orphan
                          # and Qt pinentry is deliberately not reinstalled:
                          # the GTK3/gcr deps are already in the base, and
                          # the dialog is Wayland-native under Hyprland
        - pipx
        - pymol
        - setools-console
        - setroubleshoot
        - udiskie
        - xdg-user-dirs-gtk
        # desktop utilities missing from the base
        - file-roller
        - grim
        - gtk4-layer-shell
        - imv
        - slurp
        - swappy
        - transmission-gtk
        - zathura
        - zathura-pdf-poppler
        - zathura-plugins-all
        - zsh
        # removals.yml stripped bazzite's blinged build — ship vanilla
        - fastfetch

  - type: script
    scripts:
      - verify-core.sh
