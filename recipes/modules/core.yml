---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Only what the bazzite-nvidia-open base does NOT already ship: every name
# here was checked against the base inventory (packages.md) — the base brings
# cockpit, podman, distrobox, gnupg2, openssh, plymouth, the xorg servers,
# hunspell, ImageMagick, fastfetch's deps and the rest of the old list, so
# re-installing them is pure redundancy.
#
# Deliberately ABSENT after the first bazzite-based CI build proved them
# fatal (2026-10-05): libinput-utils (the base ships the same name — dnf5
# errors on install-of-installed), ddcutil (the base ships terra-ddcutil,
# which conflicts with Fedora's ddcutil), and mpv (Fedora's mpv needs
# libavfilter-free, which the base's epoch-1 RPM Fusion ffmpeg obsoletes;
# RPM Fusion ships no mpv and Terra only mpv-nightly — dropped by user
# decision). The curated font set lives in fonts.yml, wired after
# programming.yml; desktop.yml drops xdg-desktop-portal-gtk/wl-clipboard for
# the same already-installed reason.
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # CLI / system utilities missing from the base
        - bleachbit
        - bluez-tools
        - brightnessctl
        - cronie
        - fail2ban
        - git
        - inotify-tools
        - igt-gpu-tools # intel-gpu-tools is renamed in Fedora 44 — dnf
                        # resolves the old name via provides, the gate must
                        # use the real one
        - lynis
        - ninja-build
        - pinentry-gnome3 # removals auto-removed pinentry-qt as a KDE orphan
                          # and Qt pinentry is deliberately not reinstalled:
                          # the GTK3/gcr deps are already in the base, and
                          # the dialog is Wayland-native under Hyprland
        - pipx
        - pymol
        - setools-console
        - setroubleshoot
        - udiskie
        - xdg-user-dirs-gtk
        # desktop utilities missing from the base
        - file-roller
        - grim
        - gtk4-layer-shell
        - imv
        - slurp
        - swappy
        - transmission-gtk
        - zathura
        - zathura-pdf-poppler
        - zathura-plugins-all
        - zsh
        # removals.yml stripped bazzite's blinged build — ship vanilla
        - fastfetch

  - type: script
    scripts:
      - verify-core.sh
