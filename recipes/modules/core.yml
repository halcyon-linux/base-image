---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Only what the bazzite-nvidia-open base does NOT already ship: every name
# here was checked against the base inventory (packages.md) — the base brings
# cockpit, podman, distrobox, gnupg2, openssh, plymouth, the xorg servers,
# hunspell, ImageMagick, fastfetch's deps and the rest of the old list, so
# re-installing them is pure redundancy. The curated font set replaces the
# base fonts swept in the removals module (dejavu-sans-fonts returns as a
# noctalia-git hard dep).
modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - fonts.repo # priority=1 + includepkgs: the curated font set only
    install:
      install-weak-deps: false
      packages:
        # curated fonts (fonts-cleanup.sh swept every base font package)
        - google-noto-color-emoji-fonts
        - jetbrains-mono-fonts-all
        - nerd-fonts-jetbrainsmono
        - nerd-fonts-symbols-only
        - nerd-fonts-ubuntu
        - nerd-fonts-ubuntu-mono
        # CLI / system utilities missing from the base
        - bleachbit
        - bluez-tools
        - brightnessctl
        - cronie
        - ddcutil
        - fail2ban
        - git
        - libinput-utils
        - inotify-tools
        - intel-gpu-tools
        - lynis
        - ninja-build
        - pipx
        - pymol
        - setools-console
        - setroubleshoot
        - udiskie
        - xdg-user-dirs-gtk
        # desktop utilities missing from the base
        - file-roller
        - grim
        - gtk4-layer-shell
        - imv
        - mpv
        - slurp
        - swappy
        - transmission-gtk
        - zathura
        - zathura-pdf-poppler
        - zathura-plugins-all
        - zsh
        # removals.yml stripped bazzite's blinged build — ship vanilla
        - fastfetch

  - type: script
    scripts:
      - repo-leftover-sweep.sh

  - type: script
    scripts:
      - verify-core.sh
