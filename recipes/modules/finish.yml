---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Stage 09 — finish: image identity → grub timing → hygiene. The bazzite base
# ships a valid initramfs for its kernel and this recipe adds no kernel
# modules, so the old initramfs regeneration step is gone entirely.
modules:
  # /etc/os-release identity (the module merges keys; the base's
  # /usr/lib/os-release keeps the bazzite values underneath).
  - type: os-release
    properties:
      NAME: halcyon
      PRETTY_NAME: halcyon (Bazzite)
      HOME_URL: https://github.com/halcyon-linux/base-image

  # grub-config before finalize: finalize owns the end-of-build sweeps.
  - type: script
    scripts:
      - grub-config.sh
      - finalize.sh
