---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Stage 09 — finish: image identity → hygiene → initramfs (bazzite final-RUN
# pattern). os-release first (identity), then the sweep script, then the
# bluebuild initramfs module LAST — it regenerates the initrd for every
# kernel in /usr/lib/modules (only kernel-p03 exists at this point), so it
# must run after everything that touches modules or the boot directory.
modules:
  # /etc/os-release identity (the module merges keys; /usr/lib/os-release
  # keeps the stock Fedora values underneath).
  - type: os-release
    properties:
      NAME: halcyon
      PRETTY_NAME: halcyon (Fedora bootc)
      HOME_URL: https://github.com/halcyon-linux/base-image

  - type: script
    scripts:
      - image-info.sh
      - finalize.sh

  # Regenerates the initrd for every kernel in /usr/lib/modules (only
  # kernel-p03 exists here). install-kernel.sh defers dracut to this point on
  # purpose: its RPMs install with tsflags=noscripts, so no scriptlet ran it.
  - type: initramfs
