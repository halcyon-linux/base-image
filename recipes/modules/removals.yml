        - fzf # base copy stripped; devtools reinstalls the cli-tools COPR build
        - nano
        - nano-default-editor
        - firewall-config

  - type: script
    scripts:
      - guarded-removals.sh

  - type: script
    scripts:
      - fonts-cleanup.sh

  - type: script
    scripts:
      - erase-noscripts-off.sh

  - type: script
    scripts:
      - verify-removals.sh
