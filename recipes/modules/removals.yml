---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# The bazzite-nvidia-open base ships KDE Plasma; halcyon is a minimal Hyprland
# desktop, so the whole Plasma stack goes here. Every name in this block was
# verified present in the base inventory (packages.md) — dnf5 aborts the
# transaction on one absent name, so anything that may or may not exist
# belongs in guarded-removals.sh instead.
#
# Never list here (lookalike names that are NOT KDE and must survive):
#   kernel*/kmod-* (base kernel + NVIDIA akmods + gaming kmods), kbd*
#   (console keymaps), kpartx (multipath), kvazaar-libs (video codec).
# Orphaned kf5-/kf6-/qt5- libraries close via auto-remove: true.
#
# The whole stage runs under a staged tsflags=noscripts drop-in
# (erase-noscripts-on/off.sh): rpm fails the ENTIRE transaction when any
# %preun/%postun scriptlet fails, and erase scriptlets shell out to systemctl,
# which cannot work in a build chroot (akonadi-server's %postun aborts the
# transaction even after all 413 erases completed). File-trigger cache
# maintenance (ldconfig, glib schemas) is unaffected; the drop-in is removed
# before the first install stage.
modules:
  # Bazzite's own build writes exclude=mesa-* into the fedora repo files
  # (protecting its negativo/terra mesa from Fedora's). The media stack stays
  # installed here (see protect-media-stack.sh) and any mesa INSTALL (e.g. an
  # i686 variant) must remain possible — strip the mesa tokens first.
  - type: script
    scripts:
      - strip-mesa-exclusion.sh

  # Mark the whole gaming/media library stack user-installed BEFORE the
  # cascade runs: auto-remove only takes dependency-reasoned orphans, so the
  # stack survives the KDE sweep intact (user decision: it must remain).
  - type: script
    scripts:
      - protect-media-stack.sh

  - type: script
    scripts:
      - erase-noscripts-on.sh

  - type: dnf
    remove:
      auto-remove: true # sweeps the orphaned kf5/kf6/qt5 closure with the stack
      packages:
