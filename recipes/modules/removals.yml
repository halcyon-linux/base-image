---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# The bazzite-nvidia-open base ships KDE Plasma; halcyon is a minimal Hyprland
# desktop, so the whole Plasma stack goes here. Every name was verified
# present in the base image — dnf5 aborts the transaction on one absent name,
# so may-or-may-not names belong in guarded-removals.sh instead.
#
# Never list here (surviving lookalikes): kernel*/kmod-* (base kernel + NVIDIA
# akmods + gaming kmods), kbd* (console keymaps), kpartx (multipath),
# kvazaar-libs (video codec). Orphaned kf5-/kf6-/qt5- libraries close via
# auto-remove: true. The staged tsflags=noscripts + excludepkgs drop-in is
# documented on erase-noscripts-on.sh and in AGENTS.md §3.
modules:
  # bazzite's build wrote exclude=mesa-* into the fedora repo files; the
  # mesa tokens go so any mesa INSTALL stays possible (kernel/steam stay).
  - type: script
    scripts:
      - strip-mesa-exclusion.sh

  - type: script
    scripts:
      - erase-noscripts-on.sh

  - type: dnf
    remove:
      auto-remove: true # sweeps the orphaned kf5/kf6/qt5 closure with the stack
      packages:
        # --- Plasma shell, components and settings ---
        - plasma-workspace
        - plasma-workspace-common
        - plasma-workspace-wallpapers
        - plasma-desktop
        - plasma-systemmonitor
        - plasma-systemsettings
        - plasma-disks
        - plasma-nm
        - plasma-pa
        - plasma-milou
        - plasma-setup
        - plasma-vault
        - plasma-thunderbolt
        - plasma-print-manager
        - plasma-browser-integration
        - plasma-keyboard
        - plasma-login-manager
        - plasma-lookandfeel-fedora
        - plasma-oxygen
        - plasma-oxygen-qt5
        - plasma-oxygen-qt6
        - plasma-breeze
        - plasma-breeze-qt5
        - plasma-breeze-qt6
        - plasma-activities
        - plasma-activities-stats
        - plasma-integration
        - plasma-integration-qt5
        - plasma-foreground-booster-dmemcg
        - plasma5support
        - kwin
        - powerdevil
        - kscreen
        - kscreenlocker
        - kglobalacceld
        - polkit-kde
        - kde-settings
        - kde-settings-plasma
        - kde-settings-plasmalogin
        - kde-settings-pulseaudio
        - kde-filesystem
        - krunner-bazaar # bazaar's krunner integration — KDE-only, bazaar itself stays
        - krunner-yafti
        - steamdeck-kde-presets-desktop
        # --- KDE applications (replaced by halcyon's GTK set) ---
        - konsole
        - dolphin
        - kate
        - kwrite
        - spectacle
        - ark
        - filelight
        - kfind
        - kinfocenter
        - kmenuedit
        - krdc
