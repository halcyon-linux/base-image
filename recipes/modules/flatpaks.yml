---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Zero-flatpak policy. The enforcement is NOT the bluebuild default-flatpaks
# module anymore: its v1 boot script no-ops silently on any early failure and
# matches its remove list against installed APPS only (it could never remove
# runtimes) — and in the field it left the whole bazzite flatpak payload in
# place after a rebase. The overlay owns it now: halcyon-flatpak-setup.service
# (shipped by files/system, enabled in ujust.yml) uninstalls every app in the
# baked list and sweeps unused runtimes/extensions on every boot — no
# network, idempotent, no-op on a clean machine. This module only gates the
# shipped enforcement at build time (the masks are ujust-stage state, gated
# by final-verify at end state).
modules:
  - type: script
    scripts:
      - verify-flatpaks.sh
