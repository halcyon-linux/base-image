---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # repos + install in ONE dnf module: the module removes the repo files at
  # the end of its own RUN (cleanup: true), so a split repos/install pair
  # leaves the install transaction with Fedora only (observed: "No match" for
  # every non-Fedora package).
  - type: dnf
    repos:
      cleanup: true
      files:
        - vscode.repo
        - applications.repo
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    install:
      install-weak-deps: false
      packages:
        - antigravity-cli
        - antigravity-ide
        - brave-browser
        - brave-origin
        - bitwarden
        - code
        - distroshelf
        - emacs-pgtk # depends on nothing from this COPR (no zed link — verified in the specs)
        - ferdium
        - kitty
        - mullvad-vpn
        - neovim
        - obsidian
        - onlyoffice-desktopeditors
        - opencode-desktop
        - private-internet-access
        - proton-vpn-daemon
        - proton-vpn-gtk-app
        - python3-proton-core
        - python3-proton-keyring-linux
        - python3-proton-vpn-api-core
        - ticktick
        - tree-sitter-cli
        - zed # NOT pulled by emacs-pgtk — it is here by deliberate choice
        - zen-browser
        - zotero

  - type: script
    scripts:
      - repo-leftover-sweep.sh

  - type: script
    scripts:
      - verify-apps.sh
