---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - linux-firmware
        - microcode_ctl
        - intel-gpu-firmware
        - nvidia-gpu-firmware
        - atheros-firmware
        - realtek-firmware
        - iwlwifi-dvm-firmware
        - iwlwifi-mvm-firmware
        - alsa-firmware
        - alsa-sof-firmware
        - alsa-ucm
        - NetworkManager-wifi
        - wpa_supplicant
        - pipewire
        - pipewire-alsa
        - pipewire-pulseaudio
        - wireplumber
        - pcsc-lite
        - pcsc-lite-ccid
        - mesa-dri-drivers
        - mesa-vulkan-drivers
        - mesa-libEGL
        - mesa-libGL
        - mesa-dri-drivers.i686
        - mesa-vulkan-drivers.i686
        - mesa-libEGL.i686
        - mesa-libGL.i686

  - type: script
    scripts:
      - verify-hardware.sh
