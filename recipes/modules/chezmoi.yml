---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: chezmoi
    repository: "aahsnr-configs/dotfiles" # public, HTTPS — no keys needed on a fresh machine
    all-users: true # systemctl --global enable → every login user gets the wiring
    file-conflict-policy: replace # the repo is the source of truth → update runs --no-tty --force
    wait-after-boot: 5m # module defaults, stated so upstream drift stays visible
    run-every: 1d

  - type: script
    scripts:
      - verify-chezmoi.sh
