# Halcyon: enable the sshd jail (Lynis TOOL-5104).
# The journal backend comes from Fedora's paths-fedora.conf (sshd_backend =
# systemd) and is provided by python3-systemd. Bans go through firewalld via
# the fail2ban-firewalld default (jail.d/00-firewalld.conf).
# Repeat offenders are banned for progressively longer (1h, doubling per
# repeat, capped at one week) instead of the 10 minute default.
[sshd]
enabled = true
bantime = 1h
bantime.increment = true
bantime.maxtime = 1w
