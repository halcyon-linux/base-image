# Halcyon: uncommon network protocols not used on this system (Lynis NETW-3200).
# The "install ... /bin/true" lines are the exact form Lynis greps for in
# /etc/modprobe.d/; blacklist keeps them out of module dependency resolution.
blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc

install dccp /bin/true
install sctp /bin/true
install rds /bin/true
install tipc /bin/true
