# Halcyon sshd hardening (Lynis SSH-7408 suggestions from security-hardening.txt).
#
# sshd keeps the FIRST value it sees per keyword, and /etc/ssh/sshd_config
# includes /etc/ssh/sshd_config.d/*.conf in alphabetical order, so the "10-"
# prefix makes these settings win over Fedora's 50-redhat.conf and any later
# drop-in. The SSH server is disabled by default on this image; these rules
# apply whenever it is enabled (`ujust ssh`).
#
# Deliberate deviations from the Lynis suggestions:
# - Port stays 22: a non-standard port is security by obscurity and breaks
#   firewalls, scripts, and clients; accepted as one residual Lynis warning.
# - Ciphers/KexAlgorithms/MACs are not pinned: Fedora's system-wide crypto
#   policy already provides modern defaults, and hardcoded lists go stale and
#   can lock out newer clients.
# - ClientAliveInterval is set because ClientAliveCountMax is inert without it
#   (upstream default 0 disables the liveness check); dead sessions are
#   reaped after ~10 minutes.

# --- Authentication ---
# CIS: no direct root logins; stronger than Fedora's prohibit-password default
PermitRootLogin no
# keys-only authentication
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
MaxSessions 2
# CIS: throttle unauthenticated connections (OpenSSH default is 10:30:100)
MaxStartups 10:30:60
# Show the legal banner (/usr/lib/issue.net) before authentication
Banner /etc/issue.net

# --- Forwarding ---
AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no

# --- Keepalive / logging ---
TCPKeepAlive no
ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE
