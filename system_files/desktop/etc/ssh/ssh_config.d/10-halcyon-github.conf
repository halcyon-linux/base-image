# Halcyon: default GitHub SSH identity (aahsnr-configs account).
# Keeps plain git@github.com URLs working outside git-setup's includeIf tree,
# most importantly the chezmoi source directory (~/.local/share/chezmoi).
# Repositories under ~/Git/<account>/ are unaffected: git-setup's per-account
# core.sshCommand replaces the whole ssh invocation there.
Host github.com
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_ed25519_aahsnr_configs
    IdentitiesOnly yes
