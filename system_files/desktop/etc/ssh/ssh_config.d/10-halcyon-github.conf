# Halcyon: default GitHub SSH identity (aahsnr-configs account).
# Makes plain git@github.com URLs work outside git-setup's includeIf tree
# (~/Git/<account>/), where per-account core.sshCommand replaces the whole
# ssh invocation anyway. The chezmoi source directory pins its own SSH command
# via chezmoi-init.service, so this file covers every other location.
Host github.com
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_ed25519_aahsnr_configs
    IdentitiesOnly yes
