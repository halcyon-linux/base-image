# Halcyon framebuffer blacklist, from secureblue
# files/system/usr/lib/modprobe.d/secureblue-framebuffer.conf, which takes it
# from Ubuntu's kmod blacklist-framebuffer.conf.
#
# Framebuffer drivers are generally buggy and poorly-supported, and cause
# suspend failures, kernel panics and general mayhem. For this reason we
# never load them automatically.

blacklist cyber2000fb
blacklist cyblafb
blacklist gx1fb
blacklist hgafb
blacklist lxfb
blacklist matroxfb_base
blacklist neofb
blacklist pm2fb
blacklist s1d13xxxfb
blacklist sisfb
blacklist vesafb
blacklist vfb
blacklist vt8623fb
blacklist udlfb
