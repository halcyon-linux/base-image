# home-manager (init --switch, switch) refuses to run unless either
# $XDG_STATE_HOME/nix/profiles or /nix/var/nix/profiles/per-user/$USER already
# exists: "Could not find suitable profile directory". Nix does not create
# either on a first run, and /nix/var/nix/profiles/per-user is root-owned and
# not writable by users, so create the per-user one at login.
# Applied by the globally enabled user systemd-tmpfiles-setup.service.
d %S/nix          0755 - - -
d %S/nix/profiles 0755 - - -
