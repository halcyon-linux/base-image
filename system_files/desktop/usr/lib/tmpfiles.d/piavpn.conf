# Private Internet Access: runtime state. /usr/lib/piavpn is read-only, so the
# daemon's var and etc directories are symlinks into /var/lib/piavpn
# (created by install-pia).
d /var/lib/piavpn      0755 root root - -
d /var/lib/piavpn/var  0755 root root - -
d /var/lib/piavpn/etc  0755 root root - -
