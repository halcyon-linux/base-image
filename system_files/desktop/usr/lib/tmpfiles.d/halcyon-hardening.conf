# Halcyon: enforce cron file/directory permissions at every boot (Lynis
# FILE-7524 expects 0600 for files and 0700 for the spool directories).
z /etc/crontab       0600 root root -
z /etc/cron.deny     0600 root root -
z /etc/cron.d        0700 root root -
z /etc/cron.daily    0700 root root -
z /etc/cron.hourly   0700 root root -
z /etc/cron.weekly   0700 root root -
z /etc/cron.monthly  0700 root root -

# AIDE baseline database directory (halcyon-aide-init.service).
d /var/lib/aide      0700 root root - -

# fail2ban's sqlite database directory (dbfile in /etc/fail2ban/fail2ban.conf).
# The RPM owns /var/lib/fail2ban as a plain directory and its own tmpfiles.d
# only creates /run/fail2ban, so finalize's /var wipe leaves it absent. The
# server cannot recreate it -- fail2ban_t has no write on var_lib_t:dir -- and
# exits 255 on every boot:
#   avc: denied { write } ... comm="fail2ban-server" name="lib"
#        scontext=fail2ban_t tcontext=var_lib_t tclass=dir
# Creating it here is enough; policy already maps it to fail2ban_var_lib_t.
d /var/lib/fail2ban  0755 root root - -

# Process accounting directory (Lynis ACCT-9622). psacct.service has
# ConditionPathExists=/var/account and the RPM ships no tmpfiles.d, so after
# finalize's /var wipe the unit would be skipped at every boot. Its
# ExecStartPre (accton-create) creates /var/account/pacct with mode 0600.
d /var/account       0755 root root - -
