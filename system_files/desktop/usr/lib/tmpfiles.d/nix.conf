# Directories needed by Nix after /var/nix is bind-mounted on /nix.
# The Fedora nix RPM creates these in the image /nix, but that content is
# hidden once nix.mount is active on an existing bootc/rpm-ostree system.
d /nix/store                    1775 root nixbld - -
d /nix/store/.links             0755 root root   - -
d /nix/var                      0755 root root   - -
d /nix/var/log                  0755 root root   - -
d /nix/var/log/nix              0755 root root   - -
d /nix/var/log/nix/drvs         0775 root nixbld - -
d /nix/var/nix                  0775 root nixbld - -
d /nix/var/nix/db               0755 root root   - -
d /nix/var/nix/daemon-socket    0755 root root   - -
d /nix/var/nix/builds           0755 root root   7d -
d /nix/var/nix/gc-socket        0755 root root   - -
d /nix/var/nix/gcroots          0755 root root   - -
d /nix/var/nix/gcroots/per-user 1777 root root   - -
d /nix/var/nix/profiles         0755 root root   - -
d /nix/var/nix/profiles/per-user 1777 root root  - -
d /nix/var/nix/temproots        0755 root root   - -

# halcyon_nix_daemon_socket.cil labels this directory var_run_t, which carries
# the pidfile attribute that lets PID 1 create the listening socket in it. Nix
# does not label the paths it creates, so the context has to be restored, and
# this is the only place that runs early enough to matter: tmpfiles-setup is
# ordered before sysinit.target, and nix-daemon.socket is After=sysinit.target,
# so a wrong label is corrected in the same boot, before the socket binds.
z /nix/var/nix/daemon-socket    0755 root root   - -
