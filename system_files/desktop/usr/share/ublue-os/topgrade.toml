[misc]
no_self_update = true
only = [
    "system",
    "cargo",
    "flatpak",
    "distrobox",
    "containers",
    "brew_cask",
    "brew_formula",
    "nix",
    "pi",
    "home_manager",
    "node",
    "mandb",
    "mise",
    "firmware",
    "vscode",
    "tldr",
    "tmux",
    "uv",
    "vim",
    "yazi",
    "pnpm",
    "opencode",
    "codex",
    "git_repos",
    "custom_commands",
]
ignore_failures = [
    "flatpak",
    "brew_cask",
    "brew_formula",
    "nix",
    "home_manager",
    "firmware",
    "containers",
    "custom_commands",
]
assume_yes = true
no_retry = false

[commands]
"Pixi global update" = "pixi global update"
"Zsh plugins update" = "-i zsh -c 'zsh-update && source ~/.zshrc'"

[git]
repos = [
    "~/Git/halcyon/copr/*/",
]

[linux]
rpm_ostree = true
bootc = true

[flatpak]
use_sudo = false
